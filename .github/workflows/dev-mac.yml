# Catalina test build (branch catalina-test only, issue #37): the Mac package for Intel Macs on macOS 10.15, started by
# hand: `gh workflow run dev-mac --ref catalina-test`. Untested by us (no Catalina machine, no Intel Mac); the reporter
# tests it. The release (build.yml) keeps macOS 14.4 and both architectures. Publishes nothing: an artifact only.
name: dev-mac
on:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-15-intel # x86_64 build; the arm64 macos-15 queue gave no runner 3x on 2026-11-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Mac package for Catalina (x86_64, macOS 10.15)
        env:
          MAC_MIN: "10.15"
          MAC_ARCHS: x86_64
          PLUGIN_MIN: "10.15"
        run: bash scripts/mac-build-release.sh "$PWD" 0.8.41 "$PWD/out"
      - name: Check the targets
        run: |
          set -x
          B=out/build
          lipo -info "$B/mac/vtibroker"
          otool -l "$B/mac/vtibroker" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -12
          P="$B/native/VST3/Release/TI Revive Virus Control.vst3/Contents/MacOS/TI Revive Virus Control"
          lipo -info "$P"
          otool -l "$P" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -12
          # Catalina has no UniformTypeIdentifiers (#37): it must not be linked
          if otool -L "$P" | grep -q UniformTypeIdentifiers; then echo "still links UniformTypeIdentifiers"; exit 1; fi
          # a plain component package (PackageInfo at the top, no Distribution): Catalina cannot open the product archive (#37)
          K=$(mktemp -d) && ditto -x -k out/TI-Revive-*-mac.zip "$K" && xar -tf "$K"/*/"TI Revive.pkg" | tee /dev/stderr | grep -qx PackageInfo
          if xar -tf "$K"/*/"TI Revive.pkg" | grep -qx Distribution; then echo "product archive, not a component package"; exit 1; fi
      - name: Collect
        run: |
          mkdir dev && cp out/TI-Revive-*-mac.zip dev/
          cd dev && for f in *.zip; do mv "$f" "${f%-mac.zip}-catalina-test-mac.zip"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-mac-catalina
          path: dev
