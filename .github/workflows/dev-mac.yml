# Development build of the plug-in for macOS (VST3 + Audio Unit) and of the Mac package, started by hand:
# `gh workflow run dev-mac --ref <branch>`.
# Uploads the bundles as an artifact for tests on a Mac; publishes nothing. Releases: build.yml (version tags).
name: dev-mac
on:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build (universal)
        run: |
          cmake -S native -B build-native -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-native --config Release --target VirusTINative VirusTINative_AU VirusTINative_AU_Snow -- -quiet
      - name: Check the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for n in "TI Revive Virus Control" "TI Revive Virus Control (Snow)"; do # the TI and the Snow unit (E374)
            C="build-native/AU/Release/$n.component"
            ls -R "$C" | head -30
            lipo -info "$C/Contents/MacOS/$n"
            /usr/libexec/PlistBuddy -c "Print :AudioComponents:0" "$C/Contents/Info.plist"
            codesign --force --deep --sign - "$C"
            cp -R "$C" ~/Library/Audio/Plug-Ins/Components/
          done
          test -f "build-native/AU/Release/TI Revive Virus Control (Snow).component/Contents/Resources/plugin.vst3/Contents/Resources/snow-first"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i "TIRv" || true
          auval -v aumu VTIr TIRv || echo "auval failed (the runner has no Access files and no Virus)"
          auval -v aumu VTIs TIRv || echo "auval (Snow) failed (the runner has no Access files and no Virus)"
      - name: Mac package (as the release builds it)
        run: bash scripts/mac-build-release.sh "$PWD" 0.8.18-dev "$PWD/out"
      - name: Collect
        run: |
          mkdir dev && cp -R "build-native/AU/Release/TI Revive Virus Control.component" \
              "build-native/AU/Release/TI Revive Virus Control (Snow).component" dev/
          cp -R "build-native/VST3/Release/TI Revive Virus Control.vst3" dev/
          codesign --force --deep --sign - "dev/TI Revive Virus Control.component" \
              "dev/TI Revive Virus Control (Snow).component" "dev/TI Revive Virus Control.vst3"
          cp out/TI-Revive-*-mac.zip dev/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-mac
          path: dev
