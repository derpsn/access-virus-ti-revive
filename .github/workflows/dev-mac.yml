# Catalina test build (branch catalina-test only, issue #37): the Mac package for Intel Macs on macOS 10.15, started by
# hand: `gh workflow run dev-mac --ref catalina-test`. Untested by us (no Catalina machine, no Intel Mac); the reporter
# tests it. The release (build.yml) keeps macOS 14.4 and both architectures. Publishes nothing: an artifact only.
name: dev-mac
on:
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-15-intel # x86_64 build; the arm64 macos-15 queue gave no runner 3x on 2026-11-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Mac package for Catalina (x86_64, macOS 10.15)
        env:
          MAC_MIN: "10.15"
          MAC_ARCHS: x86_64
          PLUGIN_MIN: "10.15"
        run: bash scripts/mac-build-release.sh "$PWD" 0.8.41 "$PWD/out"
      - name: Check the targets
        run: |
          set -x
          B=out/build
          lipo -info "$B/mac/vtibroker"
          otool -l "$B/mac/vtibroker" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -12
          P="$B/native/VST3/Release/TI Revive Virus Control.vst3/Contents/MacOS/TI Revive Virus Control"
          lipo -info "$P"
          otool -l "$P" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -12
          # Catalina has no UniformTypeIdentifiers (#37): it must not be linked
          if otool -L "$P" | grep -q UniformTypeIdentifiers; then echo "still links UniformTypeIdentifiers"; exit 1; fi
          # the Control Center app must say 10.15 too: a fixed 11.0 made Catalina refuse it (#37)
          A=$(find "$B/native" -path "*TI Revive Control Center.app/Contents/Info.plist" | head -1)
          test -n "$A" && test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$A")" = "10.15"
          # a plain component package (PackageInfo at the top, no Distribution): Catalina cannot open the product archive (#37)
          K=$(mktemp -d) && ditto -x -k out/TI-Revive-*-mac.zip "$K" && xar -tf "$K"/*/"TI Revive.pkg" | tee /dev/stderr | grep -qx PackageInfo
          if xar -tf "$K"/*/"TI Revive.pkg" | grep -qx Distribution; then echo "product archive, not a component package"; exit 1; fi
      - name: Collect
        run: |
          mkdir dev && cp out/TI-Revive-*-mac.zip dev/
          cd dev && for f in *.zip; do mv "$f" "${f%-mac.zip}-catalina-test-mac.zip"; done
      # #37, E511: the feasibility test (the Virus' audio through libusb instead of Apple's driver) for a Catalina Mac,
      # linked against the static libusb the package step built for the broker, so the tester needs nothing else
      - name: vtiaudioprobe for Catalina (x86_64, macOS 10.15)
        run: |
          set -x
          L="$PWD/$(ls -d out/libusb-*-macos10.15-x86_64 | head -1)"
          test -f "$L/lib/libusb-1.0.a"
          (cd src/broker && clang -O2 -Wall -Wextra -arch x86_64 -mmacosx-version-min=10.15 -I"$L/include/libusb-1.0" \
            -o "$PWD/../../dev/vtiaudioprobe" vtiaudioprobe.c vtiusbaudio_libusb.c vticore_midi.c "$L/lib/libusb-1.0.a" \
            -lpthread -framework IOKit -framework CoreFoundation -framework Security)
          lipo -info dev/vtiaudioprobe
          otool -l dev/vtiaudioprobe | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos 10.15|version 10.15"
          if otool -L dev/vtiaudioprobe | grep -q libusb; then echo "libusb must be linked statically"; exit 1; fi
          cat > dev/vtiaudioprobe-README.txt <<'EOF'
          TI Revive feasibility test (issue #37): can the Virus' audio reach the Mac without Apple's USB audio driver?
          Quit Logic and the TI Revive Control Center first and wait 30 s. Then in Terminal, in the unpacked folder:

            xattr -d com.apple.quarantine vtiaudioprobe
            chmod +x vtiaudioprobe
            sudo ./vtiaudioprobe -usb 20 probe.wav

          It asks for your password (it needs root to take the Virus' audio from Apple's driver for 20 seconds). It puts
          the Virus in the mode TI Revive's plug-in uses, plays a C4 every second, records what comes over USB into
          probe.wav, and at the end gives the Virus back to Apple's driver. It sends nothing else to the Virus and stores
          nothing on it. Please post the Terminal output and attach probe.wav (zipped) in the issue.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-mac-catalina
          path: dev
