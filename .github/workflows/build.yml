# Build TI Revive: the plug-in "TI Revive" (native/) on Windows (MSVC, + ASIO driver), macOS (VST3 + AU,
# universal) and Linux (Ubuntu 22.04); the Windows broker cross-compiled with mingw-w64 and the MSI with WiX 5; the
# macOS zip (scripts/mac-build-release.sh) and the Linux tarball (scripts/linux-build-release.sh).
# Runs when a version tag v<major>.<minor>.<build> (e.g. v0.2.3) is pushed: builds everything and creates a GitHub
# Release; the version is taken from the tag. No builds on branch pushes or pull requests. By hand, to check the
# packages of a branch before a tag: gh workflow run build --ref <branch> -f version=0.0.1 - builds and uploads the
# packages as artifacts only (the release job needs a tag).
# A tag v<major>.<minor>.<build>-rc<n> (e.g. v0.8.28-rc1) makes a pre-release for testers (findings/testing.md): the
# packages carry the plain version (MSI versions must be numeric), the release is marked pre-release, the website
# skips it (scripts/site/build.py).
name: build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: test version for the packages (numeric, e.g. 0.0.1)
        default: 0.0.1

env:
  VERSION: ${{ inputs.version }} # empty on a tag push: the jobs take the tag

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mingw-w64 and libusb (Linux probe) # .github/apt/binaries.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: binaries
      - name: Build # the broker for the MSI (0.8: the classic wrapper and the research tools are not shipped)
        run: | # the version is reported to the plug-in (INFO box); a pre-release tag's -rcN is left out
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          make -C src/broker VERSION="${v%%-rc*}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: work/build/vtibroker.exe
          if-no-files-found: error

  native-windows: # the native plug-in "TI Revive" + ASIO driver "TI Revive Audio" (native/, MSVC)
    runs-on: windows-2022
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Windows MIDI Services to compile against (the MIDI port helper; nothing of it is shipped)
        shell: pwsh
        run: |
          # microsoft/MIDI's API-lock package (In-box Preview 11) for its .winmd, and C++/WinRT's code generator;
          # both pinned by SHA-256. The package's DLL is not used: the helper takes Windows' own copy (user 2026-11-15)
          New-Item -ItemType Directory midi2 | Out-Null
          $get = @(
            @{ url = 'https://github.com/microsoft/MIDI/releases/download/inbox-preview-11/Windows.Devices.Midi2.0.99.92-preview.11.nupkg';
               file = 'midi2\midi2.zip'; sha = '13AFC6E6DA2ADAC309AB8C174352F46F1C0EBE2D79E65475BD6274DEFB73DF74' },
            @{ url = 'https://www.nuget.org/api/v2/package/Microsoft.Windows.CppWinRT/2.0.250303.1';
               file = 'midi2\cppwinrt.zip'; sha = '955E3051B35DB1C00177ED14AB6B7B995C3B32A53FDB6C184EA53B1DBA66E439' })
          foreach ($g in $get) {
            Invoke-WebRequest -Uri $g.url -OutFile $g.file
            $h = (Get-FileHash $g.file -Algorithm SHA256).Hash
            if ($h -ne $g.sha) { throw "$($g.file): SHA-256 $h, expected $($g.sha)" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("$PWD\midi2\midi2.zip")
          [IO.Compression.ZipFileExtensions]::ExtractToFile(($z.Entries | ? FullName -eq 'ref/native/Windows.Devices.Midi2.winmd'), "$PWD\midi2\Windows.Devices.Midi2.winmd")
          $z.Dispose()
          $z = [IO.Compression.ZipFile]::OpenRead("$PWD\midi2\cppwinrt.zip")
          [IO.Compression.ZipFileExtensions]::ExtractToFile(($z.Entries | ? FullName -eq 'bin/cppwinrt.exe'), "$PWD\midi2\cppwinrt.exe")
          $z.Dispose()
      - name: Build
        run: |
          cmake -S native -B native-build -G "Visual Studio 17 2022" -A x64 -DVTI_MIDI2_WINMD="$PWD\midi2\Windows.Devices.Midi2.winmd" -DVTI_CPPWINRT_EXE="$PWD\midi2\cppwinrt.exe"
          cmake --build native-build --config Release --target VirusTINative VirusTINative_ASIO tirevive-cc TIReviveControlCenter vtitests tirevive-midiports
      - name: Pester 5 (installer script tests in ctest)
        shell: pwsh
        run: |
          # exact version (audit #16); -SkipPublisherCheck because the image's Pester 3.4 has another signer (Pester docs)
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq ([version]'5.9.1'))) {
              Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck }
      - name: Unit tests
        run: ctest --test-dir native-build -C Release --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory nativebin | Out-Null
          Copy-Item -Recurse "native-build\VST3\Release\TI Revive.vst3" nativebin\
          Remove-Item "nativebin\TI Revive.vst3\Contents\x86_64-win\*.map" -ErrorAction SilentlyContinue
          Copy-Item native-build\bin\Release\VirusTINative_ASIO.dll nativebin\
          Copy-Item native-build\bin\Release\tirevive-cc.exe nativebin\
          Copy-Item native-build\ccapp\TIReviveControlCenter.exe nativebin\
          Copy-Item native-build\bin\Release\tirevive-midiports.exe nativebin\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativebin
          path: nativebin
          if-no-files-found: error
      - name: Hardware run tools (test only, never in the release; a failure here does not stop the build)
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build native-build --config Release --target nativehost
          New-Item -ItemType Directory hil | Out-Null
          Copy-Item native-build\bin\Release\nativehost.exe, scripts\hil-win.ps1, scripts\hil-win.cmd, scripts\hil_check.py, scripts\timing_analysis.py hil\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: TI-Revive-hil-windows
          path: hil
          if-no-files-found: warn

  msi:
    needs: [binaries, native-windows]
    runs-on: windows-2022
    timeout-minutes: 20 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nativebin
          path: nativebin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          # tag v1.2.3 -> 1.2.3 (MSI versions must be numeric)
          if ($env:VERSION -match '^\d+\.\d+\.\d+$') { $v = $env:VERSION }
          elseif ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)(-rc\d+)?$') { $v = $Matches[1] } else { throw "not a version tag: $env:GITHUB_REF" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "MSI version $v"
      - name: Install WiX 5
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          ./src/installer/build.ps1 -Bin "$PWD\bin" -Src "$PWD\src" -Out "$PWD\out" -Version "${{ steps.ver.outputs.version }}" -Bundle -NativeBin "$PWD\nativebin"
      - name: Rename
        shell: pwsh
        run: |
          Rename-Item "out\TI Revive.msi" "TI-Revive-${{ steps.ver.outputs.version }}.msi"
          Rename-Item "out\TI Revive setup.exe" "TI-Revive-${{ steps.ver.outputs.version }}-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-msi
          path: |
            out/TI-Revive-*.msi
            out/TI-Revive-*-setup.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          submodules: recursive # native/external/vst3sdk
      - name: Build
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          bash repo/scripts/mac-build-release.sh repo "${v%%-rc*}" "$PWD/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-mac
          path: out/TI-Revive-*-mac.zip
          if-no-files-found: error
      - name: Hardware run tools (test only, never in the release; a failure here does not stop the build)
        continue-on-error: true
        run: |
          cmake --build out/build/native --config Release --target nativehost -- -quiet
          mkdir hil
          cp out/build/native/bin/Release/nativehost repo/scripts/hil-mac.command repo/scripts/hil_check.py \
              repo/scripts/timing_analysis.py hil/
          codesign --force --sign - hil/nativehost
          chmod +x hil/nativehost hil/hil-mac.command
          ditto -c -k --keepParent hil TI-Revive-hil-mac.zip # keeps the execute bits (an artifact zip drops them)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: TI-Revive-hil-mac
          path: TI-Revive-hil-mac.zip
          if-no-files-found: warn

  # the libusb package (#37, E511): TI Revive's root service takes the Virus' audio instead of Apple's driver, for Macs
  # where that driver crackles (Catalina). Intel, macOS 10.15. Not tested by us (no Catalina Mac): its reporter tests.
  mac-libusb:
    runs-on: macos-15-intel # x86_64 build; Catalina runs on Intel Macs only
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          submodules: recursive # native/external/vst3sdk
      - name: Build
        env:
          MAC_MIN: "10.15"
          MAC_ARCHS: x86_64
          PLUGIN_MIN: "10.15"
          LIBUSB_AUDIO: "1"
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          bash repo/scripts/mac-build-release.sh repo "${v%%-rc*}" "$PWD/out"
      - name: Check the targets and the package
        run: |
          set -x
          B=out/build
          lipo -info "$B/mac/vtibroker"
          P="$B/native/VST3/Release/TI Revive.vst3/Contents/MacOS/TI Revive"
          otool -l "$P" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -12
          # Catalina has no UniformTypeIdentifiers (#37): it must not be linked
          if otool -L "$P" | grep -q UniformTypeIdentifiers; then echo "still links UniformTypeIdentifiers"; exit 1; fi
          A=$(find "$B/native" -path "*TI Revive Control Center.app/Contents/Info.plist" | head -1)
          test -n "$A" && test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$A")" = "10.15"
          K=$(mktemp -d) && ditto -x -k out/TI-Revive-*-mac-libusb.zip "$K"
          PKG=$(ls "$K"/*/"TI Revive.pkg")
          # a plain component package: Catalina's Installer cannot open the product archive (#37)
          xar -tf "$PKG" | grep -qx PackageInfo
          if xar -tf "$PKG" | grep -qx Distribution; then echo "product archive, not a component package"; exit 1; fi
          # the marker that makes postinstall install the root service, and its README
          X=$(mktemp -d) && (cd "$X" && xar -xf "$PKG" Scripts && gzip -dc Scripts | cpio -i --quiet)
          test -f "$X/libusb-audio" && grep -q tirevive.usbaudio "$X/postinstall"
          test -f "$K"/*/README-mac-libusb.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-mac-libusb
          path: out/TI-Revive-*-mac-libusb.zip
          if-no-files-found: error

  native-linux: # the native plug-in for Linux, on Ubuntu 22.04 (glibc 2.35: runs on Ubuntu 22.04 / Debian 12 and newer)
    runs-on: ubuntu-22.04
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # native/external/vst3sdk
      - name: Build dependencies # .github/apt/native-linux.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: native-linux
      - name: CMake
        run: |
          pip3 install --user "cmake==3.31.10" # Ubuntu 22.04 ships 3.22; the last 3.x (exact: audit #16)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compiler cache # ccache's objects of the last run on this branch; a tag run starts empty (main builds nothing)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-native-linux-${{ github.sha }}
          restore-keys: ccache-native-linux-
      - name: Build
        env:
          CCACHE_MAXSIZE: 500M
          # VSTGUI builds with precompiled headers, which ccache only caches with this sloppiness; __DATE__/__TIME__
          # appear only in two SDK sample tools (validator, moduleinfotool), never in our code
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          ccache --zero-stats # the statistics below are this run's (the cache keeps them across runs)
          cmake -S native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVTI_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache # a new warning in our code fails here (E13)
          cmake --build native-build --target VirusTINative tirevive-cc TIReviveControlCenter vtitests nativehost xclose
          ccache --show-stats --verbose
          strip "native-build/VST3/Release/TI Revive.vst3/Contents/x86_64-linux/TI Revive.so"
          mkdir native-linux && cp -R "native-build/VST3/Release/TI Revive.vst3" native-linux/
          install -m 0755 -s native-build/bin/Release/tirevive-cc native-linux/
          install -m 0755 -s native-build/ccapp/TIReviveControlCenter native-linux/
      - name: Unit tests
        run: ctest --test-dir native-build --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux
          path: native-linux
          if-no-files-found: error

  coverage: # line coverage of native/src by vtitests must stay at 95 % or more (scripts/coverage.py, findings/testing.md)
    # not in the release's needs: a red coverage job shows in the run (the release routine wants every job green),
    # but it cannot hold back a hotfix on its own
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # native/external/vst3sdk (the CMake project configures it)
      - name: Build dependencies # same list as native-linux, cached
        uses: ./.github/actions/apt-install
        with:
          list: native-linux
      - name: CMake
        run: |
          pip3 install --user "cmake==3.31.10" # Ubuntu 22.04 ships 3.22; the last 3.x (exact: audit #16)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Coverage
        run: python3 -I scripts/coverage.py --build cov-build --min 95 --show 15

  linux:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux
          path: native-linux
      - name: Install build tools # .github/apt/linux.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: linux
      - name: Build
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          NATIVE_PREBUILT="$PWD/native-linux/TI Revive.vst3" NATIVE_CC="$PWD/native-linux/tirevive-cc" NATIVE_CCAPP="$PWD/native-linux/TIReviveControlCenter" bash scripts/linux-build-release.sh "$PWD" "${v%%-rc*}" "$PWD/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-linux
          path: out/TI-Revive-*-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msi, mac, mac-libusb, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-msi
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-mac
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-mac-libusb
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-linux
          path: out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: | # libusb.sh: the pinned libusb source for the LGPL asset (audit #7; first tag after it failed)
            scripts/tirevive-usbinfo.ps1
            scripts/libusb.sh
          sparse-checkout-cone-mode: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # only this version's "New in" part: earlier releases keep their own text, the site's changelog lists them all
          cat > notes.md <<EOF_NOTES
          **TI Revive $v** - the Access Virus TI without the old Access drivers, with the
          native plug-in **"TI Revive"**: works like the original Virus Control and runs
          natively on Windows, macOS (Apple Silicon and Intel) and Linux - no Rosetta, Wine or yabridge.

          **New in 0.8.43: new names (the plug-in is now "TI Revive"), the Control Center without the Burn and OS Updater buttons, and a new home for the project.**

          - **New names.** The plug-in is "TI Revive" (before "TI Revive Virus Control"), the Windows ASIO driver "TI Revive Audio" (before "TI Revive Virus Audio") and the MIDI inputs "TI Revive Synth" and "TI Revive MIDI" (before "Virus TI Synth" and "Virus TI MIDI"; with several Viruses "TI Revive 2 Synth" and so on). The installers remove the plug-in under its old name, so your DAW does not list it twice. Projects saved with the old name open with it (same plug-in ID; checked in REAPER on Linux, where the slot keeps its old name, in Logic and Ableton Live on macOS, and in Ableton Live on Windows, where the ASIO driver shows up once as "TI Revive Audio"). If a track used one of the MIDI inputs, choose it there once more.
          - **Control Center:** the Burn To Flash ROM and OS Updater buttons are gone. TI Revive never offered these functions (they write the Virus' flash); before, they only said so.
          - **Not affiliated:** the plug-in's welcome and What's New pages say at the bottom that TI Revive is not affiliated with or endorsed by Access Music or Kemper.
          - **The project moved** to github.com/derpsn/ti-revive and its website to derpsn.github.io/ti-revive. Old links to the repository, issues, releases and the website forward; the update check of installed versions keeps working.

          Earlier versions: their own release pages, and every version's changes on one page in the
          [changelog](https://derpsn.github.io/ti-revive/changelog.html).

          Not affiliated with Access Music or Kemper. Contains no Access software. See the
          [README](https://github.com/$GITHUB_REPOSITORY#readme) for how it works, limitations and uninstall.
          EOF_NOTES
          pre=
          if [[ "$v" == *-rc* ]]; then # a pre-release for testers: its own note on top, marked pre-release
            pre=--prerelease
            { printf '%s\n\n' "**Pre-release for testers.** Please test with a disposable project and report with the \"Test report\" issue template. The packages carry version ${v%%-rc*}: on Windows, uninstall this pre-release before installing the final ${v%%-rc*}."
              cat notes.md; } > notes-pre.md && mv notes-pre.md notes.md
          fi
          # LGPL: the source of the libusb the macOS/Linux brokers link statically goes with every release
          . repo/scripts/libusb.sh && libusb_fetch "out/libusb-$LIBUSB_VER.tar.bz2" # version + SHA-256 pinned there
          gh release create "$GITHUB_REF_NAME" out/TI-Revive-*-setup.exe out/TI-Revive-*.msi out/TI-Revive-*-mac.zip \
            out/TI-Revive-*-mac-libusb.zip out/TI-Revive-*-linux.tar.gz repo/scripts/tirevive-usbinfo.ps1 "out/libusb-$LIBUSB_VER.tar.bz2" \
            --repo "$GITHUB_REPOSITORY" --title "TI Revive $v" --notes-file notes.md $pre
