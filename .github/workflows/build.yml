# Build TI Revive: the plug-in "TI Revive Virus Control" (native/) on Windows (MSVC, + ASIO driver), macOS (VST3 + AU,
# universal) and Linux (Ubuntu 22.04); the Windows broker cross-compiled with mingw-w64 and the MSI with WiX 5; the
# macOS zip (scripts/mac-build-release.sh) and the Linux tarball (scripts/linux-build-release.sh).
# Runs when a version tag v<major>.<minor>.<build> (e.g. v0.2.3) is pushed: builds everything and creates a GitHub
# Release; the version is taken from the tag. No builds on branch pushes or pull requests. By hand, to check the
# packages of a branch before a tag: gh workflow run build --ref <branch> -f version=0.0.1 - builds and uploads the
# packages as artifacts only (the release job needs a tag).
# A tag v<major>.<minor>.<build>-rc<n> (e.g. v0.8.28-rc1) makes a pre-release for testers (findings/testing.md): the
# packages carry the plain version (MSI versions must be numeric), the release is marked pre-release, the website
# skips it (scripts/site/build.py).
name: build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: test version for the packages (numeric, e.g. 0.0.1)
        default: 0.0.1

env:
  VERSION: ${{ inputs.version }} # empty on a tag push: the jobs take the tag

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mingw-w64 and libusb (Linux probe) # .github/apt/binaries.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: binaries
      - name: Build # the broker for the MSI (0.8: the classic wrapper and the research tools are not shipped)
        run: | # the version is reported to the plug-in (INFO box); a pre-release tag's -rcN is left out
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          make -C src/broker VERSION="${v%%-rc*}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: work/build/vtibroker.exe
          if-no-files-found: error

  native-windows: # the native plug-in "TI Revive Virus Control" + ASIO driver "TI Revive Virus Audio" (native/, MSVC)
    runs-on: windows-2022
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S native -B native-build -G "Visual Studio 17 2022" -A x64
          cmake --build native-build --config Release --target VirusTINative VirusTINative_ASIO tirevive-cc TIReviveControlCenter vtitests
      - name: Pester 5 (installer script tests in ctest)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge ([version]'5.0'))) {
              Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck }
      - name: Unit tests
        run: ctest --test-dir native-build -C Release --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory nativebin | Out-Null
          Copy-Item -Recurse "native-build\VST3\Release\TI Revive Virus Control.vst3" nativebin\
          Remove-Item "nativebin\TI Revive Virus Control.vst3\Contents\x86_64-win\*.map" -ErrorAction SilentlyContinue
          Copy-Item native-build\bin\Release\VirusTINative_ASIO.dll nativebin\
          Copy-Item native-build\bin\Release\tirevive-cc.exe nativebin\
          Copy-Item native-build\ccapp\TIReviveControlCenter.exe nativebin\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativebin
          path: nativebin
          if-no-files-found: error
      - name: Hardware run tools (test only, never in the release; a failure here does not stop the build)
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build native-build --config Release --target nativehost
          New-Item -ItemType Directory hil | Out-Null
          Copy-Item native-build\bin\Release\nativehost.exe, scripts\hil-win.ps1, scripts\hil-win.cmd, scripts\hil_check.py, scripts\timing_analysis.py hil\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: TI-Revive-hil-windows
          path: hil
          if-no-files-found: warn

  msi:
    needs: [binaries, native-windows]
    runs-on: windows-2022
    timeout-minutes: 20 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nativebin
          path: nativebin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          # tag v1.2.3 -> 1.2.3 (MSI versions must be numeric)
          if ($env:VERSION -match '^\d+\.\d+\.\d+$') { $v = $env:VERSION }
          elseif ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)(-rc\d+)?$') { $v = $Matches[1] } else { throw "not a version tag: $env:GITHUB_REF" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "MSI version $v"
      - name: Install WiX 5
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          ./src/installer/build.ps1 -Bin "$PWD\bin" -Src "$PWD\src" -Out "$PWD\out" -Version "${{ steps.ver.outputs.version }}" -Bundle -NativeBin "$PWD\nativebin"
      - name: Rename
        shell: pwsh
        run: |
          Rename-Item "out\TI Revive.msi" "TI-Revive-${{ steps.ver.outputs.version }}.msi"
          Rename-Item "out\TI Revive setup.exe" "TI-Revive-${{ steps.ver.outputs.version }}-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-msi
          path: |
            out/TI-Revive-*.msi
            out/TI-Revive-*-setup.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          submodules: recursive # native/external/vst3sdk
      - name: Build
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          bash repo/scripts/mac-build-release.sh repo "${v%%-rc*}" "$PWD/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-mac
          path: out/TI-Revive-*-mac.zip
          if-no-files-found: error
      - name: Hardware run tools (test only, never in the release; a failure here does not stop the build)
        continue-on-error: true
        run: |
          cmake --build out/build/native --config Release --target nativehost -- -quiet
          mkdir hil
          cp out/build/native/bin/Release/nativehost repo/scripts/hil-mac.command repo/scripts/hil_check.py \
              repo/scripts/timing_analysis.py hil/
          codesign --force --sign - hil/nativehost
          chmod +x hil/nativehost hil/hil-mac.command
          ditto -c -k --keepParent hil TI-Revive-hil-mac.zip # keeps the execute bits (an artifact zip drops them)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: TI-Revive-hil-mac
          path: TI-Revive-hil-mac.zip
          if-no-files-found: warn

  native-linux: # the native plug-in for Linux, on Ubuntu 22.04 (glibc 2.35: runs on Ubuntu 22.04 / Debian 12 and newer)
    runs-on: ubuntu-22.04
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # native/external/vst3sdk
      - name: Build dependencies # .github/apt/native-linux.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: native-linux
      - name: CMake
        run: |
          pip3 install --user "cmake>=3.25" # Ubuntu 22.04 ships 3.22
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compiler cache # ccache's objects of the last run on this branch; a tag run starts empty (main builds nothing)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-native-linux-${{ github.sha }}
          restore-keys: ccache-native-linux-
      - name: Build
        env:
          CCACHE_MAXSIZE: 500M
          # VSTGUI builds with precompiled headers, which ccache only caches with this sloppiness; __DATE__/__TIME__
          # appear only in two SDK sample tools (validator, moduleinfotool), never in our code
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          ccache --zero-stats # the statistics below are this run's (the cache keeps them across runs)
          cmake -S native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVTI_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache # a new warning in our code fails here (E13)
          cmake --build native-build --target VirusTINative tirevive-cc TIReviveControlCenter vtitests nativehost xclose
          ccache --show-stats --verbose
          strip "native-build/VST3/Release/TI Revive Virus Control.vst3/Contents/x86_64-linux/TI Revive Virus Control.so"
          mkdir native-linux && cp -R "native-build/VST3/Release/TI Revive Virus Control.vst3" native-linux/
          install -m 0755 -s native-build/bin/Release/tirevive-cc native-linux/
          install -m 0755 -s native-build/ccapp/TIReviveControlCenter native-linux/
      - name: Unit tests
        run: ctest --test-dir native-build --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux
          path: native-linux
          if-no-files-found: error

  coverage: # line coverage of native/src by vtitests must stay at 95 % or more (scripts/coverage.py, findings/testing.md)
    # not in the release's needs: a red coverage job shows in the run (the release routine wants every job green),
    # but it cannot hold back a hotfix on its own
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # native/external/vst3sdk (the CMake project configures it)
      - name: Build dependencies # same list as native-linux, cached
        uses: ./.github/actions/apt-install
        with:
          list: native-linux
      - name: CMake
        run: |
          pip3 install --user "cmake>=3.25" # Ubuntu 22.04 ships 3.22
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Coverage
        run: python3 -I scripts/coverage.py --build cov-build --min 95 --show 15

  linux:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux
          path: native-linux
      - name: Install build tools # .github/apt/linux.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: linux
      - name: Build
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          NATIVE_PREBUILT="$PWD/native-linux/TI Revive Virus Control.vst3" NATIVE_CC="$PWD/native-linux/tirevive-cc" NATIVE_CCAPP="$PWD/native-linux/TIReviveControlCenter" bash scripts/linux-build-release.sh "$PWD" "${v%%-rc*}" "$PWD/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-linux
          path: out/TI-Revive-*-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msi, mac, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-msi
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-mac
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-linux
          path: out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: scripts/tirevive-usbinfo.ps1
          sparse-checkout-cone-mode: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # only this version's "New in" part: earlier releases keep their own text, the site's changelog lists them all
          cat > notes.md <<EOF_NOTES
          **TI Revive $v** - Total Integration for the Access Virus TI without the old Access drivers, now with the
          native plug-in **"TI Revive Virus Control"**: looks and works like the original Virus Control and runs
          natively on Windows, macOS (Apple Silicon and Intel) and Linux - no Rosetta, Wine or yabridge.

          **New in 0.8.41: lower latency as an experimental option; an Options page in the Control Center; the plug-in restarts scrambled Virus audio by itself and tells you when the Virus stops sending audio; macOS: the installer refuses systems older than 14.4; the plug-in log is on by default for easier bug reports; the Virus display shows the sync like the original, and the plug-in names each patch as it syncs; the arpeggiator follows a count-in and the beat like with the original; on the TI Snow the plug-in's level meters work.**

          - **Lower latency, experimental (#30):** a new option on the Control Center's Options page, off by default. At audio buffers up to 256 a note takes 36 to 48 ms instead of 76 to 87 ms (44.1 kHz: 39.2 / 43.5 / 47.9 ms at 64 / 128 / 256; 48 kHz: 36.0 / 40.0 / 44.0 ms), at 512 55 to 59 ms; above 512 nothing changes. Measured on our TI2 Desktop on Linux in 10 to 20 sessions per setting, every note on time. It leaves your DAW only about 20 ms of slack: if your computer or DAW stalls longer, a note comes late, where the default absorbs it. Not yet tested in a DAW, on Windows or on macOS.
          - **Arpeggiator with a count-in (#30):** when your DAW counts in before recording, the Virus' arpeggiator and clock-synced LFOs now run in time with the bar, as with the original. Before, the plug-in told the Virus "bar 1" at the start of the count-in, so the arpeggiator ran a count-in ahead for the whole take. The plug-in now also sends its MIDI clock on the beat after every Play, and a Stop to the Virus when you stop. Checked on our TI2 Desktop on Linux (what the plug-in sends, and notes on time), and by a tester with a TI Snow in Logic: the arpeggiator starts in time after a one-bar count-in.
          - **TI Snow: the level meters in the plug-in work (#30).** On the Snow they stayed empty: its window draws each part's meter as a thin bar of its own, which the plug-in never filled. Now it shows each part's note activity there, as on the TI. Checked on a simulated Snow (our simulator running the Virus' own software), with the original Snow plug-in for comparison; not yet on a real Snow.
          - **Timing re-syncs:** fixed a rare case (about 1 in 40 in our tests) where the plug-in missed the Virus' answer to a timing re-sync, after which notes could come off time. 0 missed in 239 re-syncs on our TI2 with the fix.
          - **Options page in the Control Center:** the plug-in's options (live notes, the new ones, the two test switches) as switches with a line on what each does. A change applies from the next start of the plug-in.
          - **Scrambled audio restarts by itself:** in about one start in 250 the Virus sends its audio scrambled for the whole session (we found 4 such starts in about 940; the plug-in then finds no timing marker and notes come early or late). The plug-in now recognises it and restarts the audio once, through the same steps as every start. Linux and Windows; on a Mac it is only logged for now. Tested with a simulated scrambled stream on our TI2; a real one could not be caused on purpose. Switch on the Options page.
          - **When the Virus stops sending audio**, the plug-in tells you to switch the Virus off and on. It happened once in our tests, after a change of the sample rate; only switching the Virus off and on helped.
          - **Late notes in the log:** the plug-in's log now notes when your DAW asks for audio before the Virus has sent it (DAWs that process in bursts), which makes notes late. It helps us with reports of late notes.
          - **macOS:** the installer refuses macOS versions older than 14.4 instead of installing a plug-in that cannot start there (#37). On very old versions such as Catalina, Installer then only says it cannot open the package.
          - **The plug-in log is on by default**, so a bug report has everything we need. It stays on your computer (nothing is sent anywhere) and is kept small (about 8 MB at most). To switch it off: *? > Detailed Log* in the plug-in, or the Control Center's Options page.
          - **Bank sync on the Virus display:** while the banks sync, the Virus' own display shows its syncing message for each patch, as with the original software; it showed "Configuring Virus TI" the whole time. The plug-in's sync page now names each patch as it arrives ("RAM A 85 / 128: <name>", also for user ROM banks; the display at the bottom does it for "Download entire bank"), and its time left counts only what is really missing (it said "about 9 min" when one bank, 2 minutes, was missing).
          - **Windows (#36):** fixed a case where the TI Revive service could keep talking to a Virus that had disappeared from Windows for a moment (error 433 in the log), instead of connecting again. Not tested on hardware: such a drop-off cannot be caused on purpose.
          - **The plug-in log keeps its first lines on a fresh install** (they were lost until the bank cache folder existed).
          - **Windows installer (#31): unplug the Virus before installing.** If a Virus is connected on the old Access driver, setup now asks you to unplug it before it removes that driver, and waits up to 2 minutes (in one report, removing the Access driver with the Virus connected crashed Windows; that was in a virtual machine). Plug it back in afterwards and switch the Virus off and on before the first use with TI Revive: after the Access driver it may not answer until then. driver.log now also waits until Windows has found the Virus again before it says which driver it is on. Not tested with a Virus connected yet.
          - **macOS and Linux: a stalled USB connection no longer floods the log** (#37: 300 MB in 2 minutes). The TI Revive service now resets a stalled MIDI connection, pauses after errors, and connects to the Virus again if it stays broken, as it already did on Windows.

          Earlier versions: their own release pages, and every version's changes on one page in the
          [changelog](https://derpsn.github.io/access-virus-ti-revive/changelog.html).

          Not affiliated with Access Music or Kemper. Contains no Access software. See the
          [README](https://github.com/$GITHUB_REPOSITORY#readme) for how it works, limitations and uninstall.
          EOF_NOTES
          pre=
          if [[ "$v" == *-rc* ]]; then # a pre-release for testers: its own note on top, marked pre-release
            pre=--prerelease
            { printf '%s\n\n' "**Pre-release for testers.** Please test with a disposable project and report with the \"Test report\" issue template. The packages carry version ${v%%-rc*}: on Windows, uninstall this pre-release before installing the final ${v%%-rc*}."
              cat notes.md; } > notes-pre.md && mv notes-pre.md notes.md
          fi
          # LGPL: the source of the libusb the macOS/Linux brokers link statically goes with every release
          curl -fsSL https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2 -o out/libusb-1.0.30.tar.bz2
          echo "fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  out/libusb-1.0.30.tar.bz2" | sha256sum -c -
          gh release create "$GITHUB_REF_NAME" out/TI-Revive-*-setup.exe out/TI-Revive-*.msi out/TI-Revive-*-mac.zip \
            out/TI-Revive-*-linux.tar.gz repo/scripts/tirevive-usbinfo.ps1 out/libusb-1.0.30.tar.bz2 \
            --repo "$GITHUB_REPOSITORY" --title "TI Revive $v" --notes-file notes.md $pre
