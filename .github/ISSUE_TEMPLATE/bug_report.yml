name: Bug report
description: TI Revive does not find, connect to or play your Virus TI
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows 11, Windows 10, macOS (Apple Silicon), Linux]
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Virus model
      options: [TI Desktop, TI2 Desktop, TI Polar / TI2 Polar, TI Keyboard / TI2 Keyboard, TI Snow, not sure]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: TI Revive version, OS version, DAW and version (macOS - native or "Open using Rosetta")
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Did it work before?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Plug-in (all systems): Control Center > Nerd mode > Save logs..., or diag.log from the plug-in's folder (Windows %LOCALAPPDATA%\virus-ti-native,
        macOS ~/Library/Application Support/virus-ti-native, Linux ~/.local/share/virus-ti-native). The log is on by default since 0.8.41; with 0.8.40 or older create an empty file diag.on there first, then reproduce.
        Windows: also TI-Revive-usbinfo.txt from scripts/tirevive-usbinfo.ps1 (Virus connected) and %TEMP%\vtibroker.log
        macOS: also /tmp/tirevive-vtibroker.log
        Linux: also journalctl --user -u tirevive-broker -b
        Drag the files here. Remove anything private first.
  - type: checkboxes
    id: other
    attributes:
      label: Other Virus software on this computer
      options:
        - label: a full Access "Virus TI" installation (with its drivers) was installed before
        - label: AURA Plugins' Virus Editor (or another Virus editor/driver) is installed
