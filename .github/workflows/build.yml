# Build TI Revive: the plug-in "TI Revive Virus Control" (native/) on Windows (MSVC, + ASIO driver), macOS (VST3 + AU,
# universal) and Linux (Ubuntu 22.04); the Windows broker cross-compiled with mingw-w64 and the MSI with WiX 5; the
# macOS zip (scripts/mac-build-release.sh) and the Linux tarball (scripts/linux-build-release.sh).
# Runs when a version tag v<major>.<minor>.<build> (e.g. v0.2.3) is pushed: builds everything and creates a GitHub
# Release; the version is taken from the tag. No builds on branch pushes or pull requests. By hand, to check the
# packages of a branch before a tag: gh workflow run build --ref <branch> -f version=0.0.1 - builds and uploads the
# packages as artifacts only (the release job needs a tag).
# A tag v<major>.<minor>.<build>-rc<n> (e.g. v0.8.28-rc1) makes a pre-release for testers (findings/testing.md): the
# packages carry the plain version (MSI versions must be numeric), the release is marked pre-release, the website
# skips it (scripts/site/build.py).
name: build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: test version for the packages (numeric, e.g. 0.0.1)
        default: 0.0.1

env:
  VERSION: ${{ inputs.version }} # empty on a tag push: the jobs take the tag

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mingw-w64 and libusb (Linux probe) # .github/apt/binaries.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: binaries
      - name: Build # the broker for the MSI (0.8: the classic wrapper and the research tools are not shipped)
        run: | # the version is reported to the plug-in (INFO box); a pre-release tag's -rcN is left out
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          make -C src/broker VERSION="${v%%-rc*}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: work/build/vtibroker.exe
          if-no-files-found: error

  native-windows: # the native plug-in "TI Revive Virus Control" + ASIO driver "TI Revive Virus Audio" (native/, MSVC)
    runs-on: windows-2022
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S native -B native-build -G "Visual Studio 17 2022" -A x64
          cmake --build native-build --config Release --target VirusTINative VirusTINative_ASIO tirevive-cc TIReviveControlCenter vtitests
      - name: Pester 5 (installer script tests in ctest)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge ([version]'5.0'))) {
              Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck }
      - name: Unit tests
        run: ctest --test-dir native-build -C Release --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory nativebin | Out-Null
          Copy-Item -Recurse "native-build\VST3\Release\TI Revive Virus Control.vst3" nativebin\
          Remove-Item "nativebin\TI Revive Virus Control.vst3\Contents\x86_64-win\*.map" -ErrorAction SilentlyContinue
          Copy-Item native-build\bin\Release\VirusTINative_ASIO.dll nativebin\
          Copy-Item native-build\bin\Release\tirevive-cc.exe nativebin\
          Copy-Item native-build\ccapp\TIReviveControlCenter.exe nativebin\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativebin
          path: nativebin
          if-no-files-found: error
      - name: Hardware run tools (test only, never in the release; a failure here does not stop the build)
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build native-build --config Release --target nativehost
          New-Item -ItemType Directory hil | Out-Null
          Copy-Item native-build\bin\Release\nativehost.exe, scripts\hil-win.ps1, scripts\hil-win.cmd, scripts\hil_check.py, scripts\timing_analysis.py hil\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: TI-Revive-hil-windows
          path: hil
          if-no-files-found: warn

  msi:
    needs: [binaries, native-windows]
    runs-on: windows-2022
    timeout-minutes: 20 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nativebin
          path: nativebin
      - name: Version
        id: ver
        shell: pwsh
        run: |
          # tag v1.2.3 -> 1.2.3 (MSI versions must be numeric)
          if ($env:VERSION -match '^\d+\.\d+\.\d+$') { $v = $env:VERSION }
          elseif ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)(-rc\d+)?$') { $v = $Matches[1] } else { throw "not a version tag: $env:GITHUB_REF" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "MSI version $v"
      - name: Install WiX 5
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          ./src/installer/build.ps1 -Bin "$PWD\bin" -Src "$PWD\src" -Out "$PWD\out" -Version "${{ steps.ver.outputs.version }}" -Bundle -NativeBin "$PWD\nativebin"
      - name: Rename
        shell: pwsh
        run: |
          Rename-Item "out\TI Revive.msi" "TI-Revive-${{ steps.ver.outputs.version }}.msi"
          Rename-Item "out\TI Revive setup.exe" "TI-Revive-${{ steps.ver.outputs.version }}-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-msi
          path: |
            out/TI-Revive-*.msi
            out/TI-Revive-*-setup.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          submodules: recursive # native/external/vst3sdk
      - name: Build
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          bash repo/scripts/mac-build-release.sh repo "${v%%-rc*}" "$PWD/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-mac
          path: out/TI-Revive-*-mac.zip
          if-no-files-found: error
      - name: Hardware run tools (test only, never in the release; a failure here does not stop the build)
        continue-on-error: true
        run: |
          cmake --build out/build/native --config Release --target nativehost -- -quiet
          mkdir hil
          cp out/build/native/bin/Release/nativehost repo/scripts/hil-mac.command repo/scripts/hil_check.py \
              repo/scripts/timing_analysis.py hil/
          codesign --force --sign - hil/nativehost
          chmod +x hil/nativehost hil/hil-mac.command
          ditto -c -k --keepParent hil TI-Revive-hil-mac.zip # keeps the execute bits (an artifact zip drops them)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: TI-Revive-hil-mac
          path: TI-Revive-hil-mac.zip
          if-no-files-found: warn

  native-linux: # the native plug-in for Linux, on Ubuntu 22.04 (glibc 2.35: runs on Ubuntu 22.04 / Debian 12 and newer)
    runs-on: ubuntu-22.04
    timeout-minutes: 25 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # native/external/vst3sdk
      - name: Build dependencies # .github/apt/native-linux.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: native-linux
      - name: CMake
        run: |
          pip3 install --user "cmake>=3.25" # Ubuntu 22.04 ships 3.22
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compiler cache # ccache's objects of the last run on this branch; a tag run starts empty (main builds nothing)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-native-linux-${{ github.sha }}
          restore-keys: ccache-native-linux-
      - name: Build
        env:
          CCACHE_MAXSIZE: 500M
          # VSTGUI builds with precompiled headers, which ccache only caches with this sloppiness; __DATE__/__TIME__
          # appear only in two SDK sample tools (validator, moduleinfotool), never in our code
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          ccache --zero-stats # the statistics below are this run's (the cache keeps them across runs)
          cmake -S native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVTI_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache # a new warning in our code fails here (E13)
          cmake --build native-build --target VirusTINative tirevive-cc TIReviveControlCenter vtitests nativehost xclose
          ccache --show-stats --verbose
          strip "native-build/VST3/Release/TI Revive Virus Control.vst3/Contents/x86_64-linux/TI Revive Virus Control.so"
          mkdir native-linux && cp -R "native-build/VST3/Release/TI Revive Virus Control.vst3" native-linux/
          install -m 0755 -s native-build/bin/Release/tirevive-cc native-linux/
          install -m 0755 -s native-build/ccapp/TIReviveControlCenter native-linux/
      - name: Unit tests
        run: ctest --test-dir native-build --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux
          path: native-linux
          if-no-files-found: error

  linux:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux
          path: native-linux
      - name: Install build tools # .github/apt/linux.txt, cached
        uses: ./.github/actions/apt-install
        with:
          list: linux
      - name: Build
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#v}}"
          NATIVE_PREBUILT="$PWD/native-linux/TI Revive Virus Control.vst3" NATIVE_CC="$PWD/native-linux/tirevive-cc" NATIVE_CCAPP="$PWD/native-linux/TIReviveControlCenter" bash scripts/linux-build-release.sh "$PWD" "${v%%-rc*}" "$PWD/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TI-Revive-linux
          path: out/TI-Revive-*-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msi, mac, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hanging step (e.g. a stuck package mirror) fails fast instead of blocking
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-msi
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-mac
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TI-Revive-linux
          path: out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: scripts/tirevive-usbinfo.ps1
          sparse-checkout-cone-mode: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF_NOTES
          **TI Revive $v** - Total Integration for the Access Virus TI without the old Access drivers, now with the
          native plug-in **"TI Revive Virus Control"**: looks and works like the original Virus Control and runs
          natively on Windows, macOS (Apple Silicon and Intel) and Linux - no Rosetta, Wine or yabridge.

          **New in 0.8.33: no more crackle on Windows, analog outputs in time, and the right Access files.**

          - Windows: the crackle that came in stretches (seen on a Windows 11 PC) is gone. The plug-in moved its clock
            reference at every uneven buffer from the host; now it moves it only for a lasting offset (31 minutes in
            Ableton Live on a real Windows 11 PC without crackle).
          - Parts on the Virus' analog outputs stay in time with the parts on USB: like the original, the plug-in tells
            the Virus to hold them back by the USB latency.
          - The plug-in follows the part you select on the Virus (Multi edit mode), like the original.
          - Only the 64-bit Virus Control.dll is used. Earlier Windows setups could copy the 32-bit one, and with it old
            Virus A/B/C patch libraries loaded empty. When updating, keep the Access .msi next to the setup (or in
            Downloads): the setup replaces the 32-bit file. Linux: install.sh does the same when run again with the .msi.
            The Control Center says when it finds the 32-bit file.
          - macOS: old Virus A/B/C library patches get the right default page B, the settings the original adds when
            it converts them (the Mac plug-in took them from the wrong place in the Access files).

          Tested on a Virus TI2 Desktop: Linux (REAPER and the automated run), macOS (MacBook Air M3, Ableton Live 12 and
          the automated run), Windows 11 on a real PC (Ableton Live, 31 minutes, and the automated run) and in a VM
          (the update from an older setup with the 32-bit file, Ableton Live 11).

          **New in 0.8.32: the Virus follows your project's sample rate, like with the original.**

          - The Virus now runs at 44.1 or 48 kHz to match the project, the way the original driver did: a 48 kHz project
            switches the Virus to 48 kHz (its display shows "Audio clock changed"), a 44.1 kHz project switches it back.
            At 88.2/96 kHz the Virus runs at 44.1/48 kHz and the plug-in converts; any other rate is converted as before.
            Windows: the ASIO device "TI Revive Virus Audio" offers 44.1 and 48 kHz.
          - The start of the Virus' audio now follows the original driver's order exactly (checked against a USB
            capture of the original).
          - When the Virus keeps sending audio at the wrong rate after a USB replug or a wake (it then stays silent),
            the plug-in now switches the rate away and back, which the Virus' USB chip cannot ignore. Before, it asked
            for the same rate again, which the chip ignores - found in the Virus' firmware. We could not make the fault
            happen on purpose, so this part is not tested against it yet.
          - Linux: install.sh takes the Access files from the right of the two copies in the .msi, so the Control Center
            opens in the Access look (issue #15). Running install.sh again with the .msi adds a missing file.

          Tested on a Virus TI2 Desktop: Linux (REAPER and the automated run, 44.1 and 48 kHz), macOS (MacBook Air M3,
          Ableton Live 12 and the automated run; the Audio Unit in GarageBand and Live), Windows 11 (VM, Ableton Live 11
          and the automated run; function checks, the VM's USB timing cannot judge timing).

          **New in 0.8.31: exports on the Mac at small buffer sizes, and the browser's selection.**

          - macOS: an export with a small buffer size (128 samples) no longer lets a few notes come late (0.8.30: 6 to
            10 of 256 notes up to 4 ms late, and the sync message appeared). Now 256 of 256 notes on the grid at 48 kHz and
            128 samples. The cause was the way the render waited for the Virus' audio, which the Mac hands over in
            512-sample pieces.
          - The browser keeps one selection per pane, like the original: with the same bank in both panes, only the
            pane you click in shows the frame, and a pane that switches to another bank drops its selection.
          - Closing the plug-in during the bank sync now logs "bank sync stopped" instead of "bank sync failed".

          Tested on a Virus TI2 Desktop: Linux with the automated run, macOS (MacBook Air M3) with the new automated run
          and an Ableton Live 12 export, Windows 11 (VM) with the new automated run (function checks; the VM's USB
          timing cannot judge timing).

          **New in 0.8.30: restore a RAM bank from a backup, and the missing mod matrix destinations.**

          - TI Revive Control Center restores a RAM bank from a backup or any library: "Restore..." (in the Access look:
            RESTORE), then the bank to overwrite. Only the programs that differ are written, into the Virus' RAM, the
            way the plug-in's browser writes them, and each one is read back. Unlike Access' Control Center it never
            writes the Virus' flash. The same from a terminal: tirevive-cc restore B "RAM B.mid".
          - The modulation matrix's destination menus (and the LFO assign target) now list Distortion Mix, Osc 1/2
            F-Shift and Osc 1/2 F-Spread, and no longer show "-reserved-" entries (issue #11). A patch that uses one of
            these destinations shows it by name.
          - Linux: when the broker gives the Virus back to the system, it now resets the USB port before it releases
            the interfaces. With the old order, restarting the DAW often a few times in a row left our Virus off USB
            until it was switched off and on or plugged in again (seen three times; 30 of 30 give-backs passed with
            the new order).

          Tested on a Virus TI2 Desktop: Linux with REAPER, Windows 11 (VM) with Ableton Live 11, macOS (MacBook Air
          M3) with Ableton Live 12; 12 of 12 test items passed, plus the automated Linux run.

          **New in 0.8.29: the browser works like the original's, and knobs on the Virus reach your DAW.**

          - Browser drag and drop like the original: drag one or several patches from a library onto a RAM slot in
            the other pane, or a part's patch name onto a RAM slot; within one bank a drag swaps the patches;
            Alt+click renames; right-click "Undo last operation" toggles the last change. Personal libraries can be
            copied into, swapped, renamed, sorted and have patches deleted; patches keep their positions with gaps.
          - A RAM bank's right-click menu has "Download entire bank from Virus TI" (about 2 minutes, progress on the
            LCD) and "Sort alphabetically". Menu entries that do not apply are hidden, as in the original.
          - "Create Empty Library" is only in the SAVE menu's Personal Libraries, as in the original.
          - Knobs you turn on the Virus reach your DAW while the plug-in window is open (issue #10): Ableton Live's
            Configure mode adds them and automation records them. A knob that stands for two parameters (Filter 1
            Cutoff or the vocoder's carrier frequency) reports only the active one.
          - Libraries from the original's three places: Personal, User and Public Libraries. On the Mac the factory
            libraries in /Library/Application Support now show (under Public Libraries).
          - The browser's program numbers are no longer drawn twice.
          - macOS: installing the same version again now replaces the plug-ins.
          - When the bank sync at start-up stops early, the log and the Virus' display no longer say it is done. A
            check that keeps broken values out of the classic oscillator display now works with the macOS and Windows
            compiler settings. On Linux, REAPER 7.82 can crash after a render when another program had the focus as
            the render window closed: this is a bug in REAPER, see "Good to know" in the README.

          Tested on a Virus TI2 Desktop: Linux with REAPER, Windows 11 (VM) with Ableton Live 11, macOS (MacBook Air
          M3) with Ableton Live 12; 13 of 13 test items passed.

          **New in 0.8.28: a review of the whole send path.** The plug-in guards the values a host sends (velocity,
          pitch bend, tempo; on Windows and macOS a NaN value got through before), sends one message per value while
          you drag a knob, and keeps its audio ring safe while the Virus goes away. When the broker restarts, the
          plug-in reconnects on its own. Popup menus and text fields close cleanly on every system; the patch name's
          text now fits its field on macOS. On Linux, the log names the cause when a USB hub leaves too little
          bandwidth for the Virus' audio. Tested on Linux (REAPER), macOS (Ableton Live 12) and Windows 11 (Ableton
          Live 11, in a VM).

          **New in 0.8.27: patch changes while you play, like the original.** Choosing a patch for one part no longer
          stops the other parts for a moment. We recorded what the original plug-in sends and do the same now: the patch
          goes to the Virus in small pieces on its own USB-MIDI cable, and the notes of the other parts go on in between.
          Automation that falls into a patch change waits for it instead of reaching only part of the Virus. Tested on
          Linux (REAPER), macOS (Ableton Live 12) and Windows 11 (Ableton Live 11, in a VM).

          **New in 0.8.27: the arpeggiator starts with the bar.** At every Play and loop restart the plug-in sends the
          song position the way the original does, so the arpeggiator and clock-synced LFOs restart on the beat.

          **New in 0.8.27: the original's start-up page.** While a project opens, the editor shows "Starting up" with
          the original's ring that fills. "Syncing memory with Virus" only appears when the plug-in really reads banks
          from the Virus; a start with a current bank cache no longer shows it.

          **Also in 0.8.27:** at host sample rates other than 44.1 kHz the first notes after Play and after a render no
          longer come late and catch up over several seconds. The MIDI activity meters of the parts work while the DAW
          automates a parameter. Host automation is time-stamped with its block on every system. On Windows the plug-in now
          has the protection against the Virus keeping the wrong sample rate after a wake that Linux got in 0.8.26.
          On macOS the plug-in fills audio cycles that Core Audio skips during an export; the late notes after an export
          seen in 0.8.25 and 0.8.26 did not come back in our 0.8.27 tests. The Linux installer names the libraries the
          Control Center needs (gtkmm 3) for Ubuntu, Fedora and Arch.

          **New in 0.8.26: steadier MIDI, from the Virus' own firmware.** We read the Virus TI's firmware (the copy
          in your Access installer) to see how it handles MIDI from the computer, and fixed what did not match:
          notes are no longer cut a second after you press Play (the Virus stops every sounding note about a second
          after the last Active Sensing message; the plug-in now sends one every 300 ms, like the original); a flood of
          MIDI can no longer overrun the Virus' small buffer for time-stamped notes (the plug-in keeps its stamped MIDI
          well under the limit; normal playing and automation never come near it); and a bank sync or patch dump no
          longer breaks when the Virus is busy for a moment, for example while you change a patch on its panel (a USB
          write the Virus did not take within a second is sent again). Tested on Linux (REAPER), macOS (Ableton Live 12)
          and Windows 11 (Ableton Live 11, in a VM).

          **Also in 0.8.26:** on Linux, if the Virus keeps the wrong sample rate after the computer wakes (seen once in
          our tests: a loud signal on its outputs, then it stopped responding until switched off and on), the broker now
          sends it silence and asks for the right rate again. Popup menus on Linux open on the monitor they belong to.
          Known issue: on macOS, after an export, notes can come late until the Virus is switched off and on (0.8.25
          does the same; 0.8.26 now shows the sync error message then). Being worked on.

          **New in 0.8.25: projects made with the original plug-in open.** Projects with the original's VST3 version
          open with TI Revive: the plug-in list also shows it as "TI Revive Virus Control (original projects)", which has
          the original's plug-in ID. Tested in Ableton Live 11 (Windows 11 VM) and Live 12 (macOS, also with a project
          made on Windows). Projects with the original's VST2 version do not open: TI Revive is VST3 only. Before, only
          hosts that read the plug-in's compatibility list could map old projects, and that list had the original's ID
          in the wrong byte order.

          **New in 0.8.25: the LOAD menu like the original's.** "Revert to" brings back the patch from before the last
          load, edits included, and a second revert goes back again; "Recently Used" lists the last 10 patches of each
          part, newest first. Personal Libraries has "Create Empty Library" with the original's save dialog. Menus look
          like the original's on Windows 10: menus with one column in Windows' modern look, menus with columns in the
          older one, with separator lines. Tested on Linux; the save dialog also on Windows and macOS.

          **Also in 0.8.25:** the plug-in reports its own version again (0.8.24 still said 0.8.23).

          **New in 0.8.24: the Virus plays again after the computer slept.** After waking, the plug-in sets the Virus
          up again like after a reconnect (start-up messages, your project's sound, new timing), also after a short USB
          drop at wake (tested with a drop of under a second on Linux). Tested on a Windows 11 PC, macOS and Linux.
          The plug-in's log no longer
          reports a false "audio stood still" at every start.

          **New in 0.8.23: export and freeze without a workaround.** The original refused offline rendering, so you
          had to find your DAW's real-time render setting or record the Virus live. TI Revive supports it: when your DAW
          renders offline (export, freeze, offline bounce), the plug-in holds each block until the Virus has made its
          sound. The render is right, but not faster than the song: the Virus plays in real time. Tested with REAPER on
          Linux, Ableton Live on macOS and in a Windows 11 VM, and GarageBand.

          **New in 0.8.23: the original's sync error message.** Like the original, the editor shows "A sync error
          occurred. Press Stop and Play to clear." when the Virus reports several notes in a row that arrived too late
          for their time stamp while your DAW plays. Stop and Play clears it.

          **Also in 0.8.23:** after a Mac wakes from sleep, the plug-in starts its timing with the Virus again (before,
          the notes stayed silent after waking); completed and tested in 0.8.24. README and website: what owners reported
          about the original plug-in, with links to the reports, and where TI Revive stands.

          **Since 0.8.22: reworked, modernized menus, the same on Windows, macOS and Linux.** Every menu (value lists,
          LOAD and SAVE, banks, libraries) is a window of its own, like the original's menus on Windows: it can reach
          beyond the plug-in window and use the whole screen, with the original's columns (the Wavetable list: 4 columns
          of 25). A submenu opens when the pointer rests on its entry for a moment, so you can move across other entries
          into an open submenu, for example from RAM A to its patches past RAM B. Arrow keys, Return and Esc work; a
          click elsewhere or switching to another window closes the menu.

          **Since 0.8.22: the REMOTE page.** The Virus' remote templates with their names, knob names and MIDI
          strings, the original's knob template list, template files to load and save, sent to the Virus like the
          original. The knob template list also works with the 32-bit Access installation on Windows.

          **Since 0.8.21: closer to the original editor.** We compared every page with the original Virus Control
          side by side. Popup menus open at their control with 25 entries per column, like the original, on Windows,
          macOS and Linux (macOS and Linux showed one long column before): the Wavetable list has 4 columns. Right-click
          the table name inside the oscillator ring to open it, as in the original. The classic oscillator display
          shows the original's waves, the HyperSaw display its lines, and a stored value above its range is shown
          clamped like in the original (Vocoder Bands "32").

          **Since 0.8.21: PATCH UTILITY > INFO** shows the TI Revive version, the version of the TI Revive service
          and the Virus' OS version. The OS version is read once at connect, with the same read-only requests as the
          original driver. The link opens the TI Revive website.

          **Also in 0.8.21:** on Windows, installing the .msi directly removes the Installed apps entries of earlier
          setup.exe installs. Virus TI Snow on macOS: USB 3 and the soft knobs work (user report, issue #4).

          **Since 0.8.20: the Control Center works next to your DAW** on macOS and Linux too (it did on Windows):
          device info, backups and Nerd mode while the plug-in plays. Its window now opens at the right size, it no
          longer crashes on closing (Linux), and Windows setups from before 0.8.2 get the Access look as well. On
          macOS the backup works when the Access installer had made Documents/Access Music as administrator: the
          installer gives the folder back to you.

          **Since 0.8.20: duplicated tracks.** The copy shows "Virus unavailable" again while the original plays (since
          0.8.18 it looked usable), and REAPER on Linux no longer crashes when a track with the plug-in is duplicated.

          **Also in 0.8.20:** Linux finds the factory patch libraries in a localized Documents folder (e.g. Dokumente);
          no dropouts in the first seconds with 4096-sample host blocks; the plug-in shows "No Virus TI can be found"
          when the TI Revive service is not running; for safety, TI Revive passes only standard read requests to the
          Virus' USB control endpoint (nothing that could reach its flash). Every package now lists the third-party
          code it contains (THIRD-PARTY-NOTICES.txt).

          **Since 0.8.18: projects bring back every patch setting.** Projects saved the parts in an older format,
          and the Virus reset about 20 newer settings when it loaded them: Input Mode, unison, arpeggiator mode,
          chorus type, envelopes 3 and 4 and more. Projects now keep the current format, and older ones are converted
          when they open. Settings that never reached the Virus in an older project open as the Virus played them.
          A new project's chorus shows "Classic": that is what the Virus makes of the original's Init patch.

          **Since 0.8.18: the "No Virus TI can be found" page.** Switch the Virus off or pull its cable while the
          editor is open and it shows the original's page for a missing Virus; it goes away by itself when the Virus
          is back. Known issue on Linux: after a cable replug, or when the Virus is switched on while no DAW runs, it
          can come back without sound until it is switched off and on once (E175, next version).

          **Since 0.8.18: help notes say why a control is greyed out**, for example "Inactive now: Chorus Type is
          Off." or "depends on Input Mode, Input Atomizer."

          ![A help note on a greyed-out control](https://raw.githubusercontent.com/derpsn/access-virus-ti-revive/main/docs/images/plugin-help-inactive.png)
          *Help note on a greyed-out control, drawn from your own Access installer. TI Revive is not affiliated with Access Music or Kemper.*

          **Since 0.8.17: audio from your DAW through the Virus.** Set PATCH UTILITY > Preferences >
          "Input and Output Configuration" to "3 Outs / 1 Input" and a part's Input Mode (FX 1 page) to Static or
          Dynamic: the plug-in's sidechain input then goes into the Virus and through that part's filters and effects,
          as in the original. REAPER: a 4-channel Virus track, the audio sent to channels 3/4. Ableton Live: pick the
          track in the device's Sidechain section. Tested on Linux (REAPER) and macOS (Ableton Live 12), not yet on a
          real Windows PC (it works in a Windows 11 VM with Ableton Live). The Audio Unit was tested in Logic Pro.

          **Since 0.8.17: help mode.** Click the ? at the bottom right of the editor: every control gets a short note
          on what it does. Point at a control to read it, click to keep the note on screen; clicks do not change values
          in this mode, and the page tabs still work. Esc or ? ends it. The notes are written for TI Revive, not taken
          from the Access manual.

          ![Help mode: a note explains the sub oscillator knob](https://raw.githubusercontent.com/derpsn/access-virus-ti-revive/main/docs/images/plugin-help-mode.png)
          *Help mode, drawn from your own Access installer. TI Revive is not affiliated with Access Music or Kemper.*

          **Since 0.8.12: sharper editor on large screens.** At 150 or 200 % (right-click the editor, or your
          display scaling) the plug-in's images are now computed sharper from your own Access files instead of
          being stretched. Linux: reopening the editor no longer crashes the DAW (since 0.8.0), and the menus open
          where you click at 150 and 200 %.

          **Since 0.8.10: steadier connection.** Switch the Virus off and on (or replug it) while your DAW runs:
          the plug-in now waits until it is ready and plays in time again. Start your DAW before the Virus is on: the
          plug-in sends its start-up and your project's sounds as soon as the Virus is there (before they were lost).
          Windows: two DAWs no longer use the Virus at the same time - the second one shows "Virus unavailable" and
          takes over when the first one closes. USB 3 now also works in "3 Outs / 1 Input".

          **Since 0.8.9: the third USB output.** Like the original Virus Control, you can now use USB 3: in the
          plug-in open PATCH UTILITY > Preferences and set "Input and Output Configuration" to "3 Outs / No Input".
          Then a part's output can be "USB3 L+R" and its sound comes out of the plug-in's Out 3 - for example for
          bass, lead and pad on three separate mixer channels in your DAW. The setting is kept for this computer.
          Thanks for asking (issue #4)!

          **Since 0.8.8: soft knobs on the Virus change the sound.** Turning the three soft knobs on the Virus itself
          now changes the sound (0.8.7 only moved them in the editor). After a preset chosen on the Virus is loaded,
          your current mod wheel, breath, expression and other controller positions are sent again, like the
          original Virus Control does.

          **Since 0.8.7: presets and soft knobs on the Virus itself.** A preset you choose on the Virus (its
          display, knobs or buttons) now loads into the plug-in and sounds - before, the part kept its old sound and
          the plug-in stayed on the old patch. The three soft knobs work in both directions now: in the editor they
          control the parameter their destination selects (Easy page), and when you turn them on the Virus the
          plug-in follows. Thanks for the reports (issue #4)!

          **Since 0.8.6: steadier start-up.** The plug-in now waits until the Virus has really worked through its
          start-up messages and your project's sound, instead of a fixed 4 seconds: the first notes play in time,
          also when a duplicated track takes over the Virus (before, the first notes after the takeover could be
          up to 2 s late).

          **Since 0.8.5: one plug-in instance per Virus, also on Windows.** Duplicating a track with the plug-in
          (e.g. in Ableton) no longer puts the Virus out of time: the copy shows "Virus unavailable" like the original
          Virus Control, and when you delete the first instance, the copy takes over the Virus and plays in time
          after a short start-up. Thanks for the report (issue #6)!

          **Since 0.8.4: bigger editor.** Right-click an empty spot of the plug-in's editor and choose a size from
          100 to 200 %; the choice is kept for new editors. The plug-in also follows the display scaling Windows
          reports (e.g. 150 %). The Control Center has the same sizes under View > Size. Thanks for the suggestion!

          **Since 0.8.3:** a DAW's plug-in scan no longer talks to the Virus (it connects only when the plug-in is
          used); saved projects no longer grow by a few bytes on every save; on a first setup the start page shows how
          long reading the Virus' banks will take (8-9 minutes once, then seconds). Thanks to the virus-ti-rework
          project for the findings.

          **Since 0.8.2: TI Revive Control Center** - in the look of Access' Virus Control Center (taken from your
          Access installer, like the plug-in's skin): device info, backup of the RAM banks as patch libraries, library
          conversion (.mid / .syx), and a **Nerd mode** that shows live what goes between TI Revive and the Virus
          (decoded, read-only) plus the logs for bug reports. Also as the command line tool \`tirevive-cc\`. Firmware /
          OS updates and flash functions are not supported, on purpose. Linux: the app needs gtkmm 3. Clean-ups: the
          Linux broker no longer opens a TCP port; the macOS broker no longer runs the MIDI stand-in of the old
          Access plug-in.

          **Windows 10/11 x64:** download \`TI-Revive-$v-setup.exe\` (or the same installer as \`TI-Revive-$v.msi\`)
          and put your own Access "Virus TI Software Suite" 64-bit \`.msi\` next to it. Run it (not code-signed:
          SmartScreen -> More info -> Run anyway) and keep "Set up the Access Virus TI files now" checked: the Access
          .msi is only unpacked, not installed. Sound card: ASIO device **"TI Revive Virus Audio"**.

          **macOS 14.4+ (Apple Silicon and Intel):** download \`TI-Revive-$v-mac.zip\`, run \`TI Revive.pkg\` (not
          signed: right-click > Open), then \`Set up Access Virus TI files.command\` with your own Access \`.pkg\` next
          to it (only unpacked). VST3 and Audio Unit (Logic, GarageBand), no Rosetta. Allow your DAW to use the
          microphone. Details: README-mac.txt.

          **Linux (x86_64, Ubuntu 22.04 / Debian 12+):** download \`TI-Revive-$v-linux.tar.gz\`, unpack it and run
          \`./install.sh\` with your Access \`.msi\` (unpacked with msitools or Wine). Details: README-linux.txt.

          **Coming from 0.7.x:** the classic plug-in "Virus TI (TI Revive)" is replaced; its projects open with
          "TI Revive Virus Control". **Virus TI Snow owners: please stay with 0.7.4 for now** - the Snow is not
          supported by 0.8.x yet (testers welcome).

          Third-party code and its licenses: THIRD-PARTY-NOTICES.txt in every package; \`libusb-1.0.30.tar.bz2\` is
          the source of the LGPL library in the macOS and Linux broker.

          Not affiliated with Access Music or Kemper. Contains no Access software. See the
          [README](https://github.com/$GITHUB_REPOSITORY#readme) for how it works, limitations and uninstall.
          EOF_NOTES
          pre=
          if [[ "$v" == *-rc* ]]; then # a pre-release for testers: its own note on top, marked pre-release
            pre=--prerelease
            { printf '%s\n\n' "**Pre-release for testers.** Please test with a disposable project and report with the \"Test report\" issue template. The packages carry version ${v%%-rc*}: on Windows, uninstall this pre-release before installing the final ${v%%-rc*}."
              cat notes.md; } > notes-pre.md && mv notes-pre.md notes.md
          fi
          # LGPL: the source of the libusb the macOS/Linux brokers link statically goes with every release
          curl -fsSL https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2 -o out/libusb-1.0.30.tar.bz2
          echo "fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  out/libusb-1.0.30.tar.bz2" | sha256sum -c -
          gh release create "$GITHUB_REF_NAME" out/TI-Revive-*-setup.exe out/TI-Revive-*.msi out/TI-Revive-*-mac.zip \
            out/TI-Revive-*-linux.tar.gz repo/scripts/tirevive-usbinfo.ps1 out/libusb-1.0.30.tar.bz2 \
            --repo "$GITHUB_REPOSITORY" --title "TI Revive $v" --notes-file notes.md $pre
